<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>生日快乐 · 一个小解谜</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-stage="lock">

  <!-- 背景光晕与漂浮粒子 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>
  </div>

  <button class="icon-btn" id="muteBtn" type="button" title="声音开关" aria-label="声音开关">🔊</button>

  <div class="dev-jump" id="devJump" hidden>
    <span>跳转：</span>
    <button type="button" data-jump="lock">1 密码锁</button>
    <button type="button" data-jump="draw">2 抽签</button>
    <button type="button" data-jump="cake">3 蛋糕</button>
    <button type="button" data-jump="dark">4 聊天</button>
  </div>

  <!-- ===================== 第一幕 · 密码锁 ===================== -->
  <section class="scene" id="scene-lock">
    <div class="lock-card" id="lockCard">
      <div class="lock-icon" id="lockIcon">🔒</div>
      <h1 class="lock-title" id="lockTitle">请输入密码</h1>
      <p class="lock-hint" id="lockHint"></p>

      <div class="pin-dots" id="pinDots" aria-label="已输入的密码"></div>

      <div class="keypad" id="keypad"></div>

      <p class="lock-msg" id="lockMsg" role="status"></p>
    </div>
  </section>

  <!-- ===================== 第二幕 · 抽签 ===================== -->
  <section class="scene" id="scene-draw">
    <header class="scene-head">
      <h2>抽一支祝福签</h2>
      <p class="sub">一共可以抽 <b>5</b> 次 · 每一支都不一样</p>
    </header>

    <div class="draw-body">
      <div class="tube-area">
        <div class="sign-card" id="signCard">
          <div class="sign-inner">
            <div class="sign-face sign-front"><span>福</span></div>
            <div class="sign-face sign-back"><p id="signText"></p></div>
          </div>
        </div>

        <div class="tube" id="tube">
          <div class="tube-sticks" id="tubeSticks"></div>
          <div class="tube-body"><span>签</span></div>
          <div class="tube-foot"></div>
        </div>

        <button class="btn btn-primary" id="drawBtn" type="button">抽一支</button>
      </div>

      <div class="draw-panel">
        <div class="counter">已抽 <b id="drawCount">0</b> / 5</div>
        <div class="slots" id="slots"></div>
      </div>
    </div>

    <div class="draw-next" id="drawNext" hidden>
      <p class="draw-done">五支签都抽完啦 🎐</p>
      <button class="btn btn-gold" id="toCakeBtn" type="button">进入下一环节 →</button>
    </div>
  </section>

  <!-- ===================== 第三幕 · 生日蛋糕 ===================== -->
  <section class="scene" id="scene-cake">
    <header class="scene-head">
      <h2>许个愿，然后吹蜡烛吧</h2>
      <p class="sub">还剩 <b id="candleLeft">21</b> 根 · 点一下吹灭一根</p>
    </header>

    <div class="cake-stage" id="cakeStage">
      <div class="candles" id="candles"></div>
      <div class="cake">
        <div class="tier tier-top"><i class="drip"></i></div>
        <div class="tier tier-bottom"><i class="drip"></i></div>
        <div class="plate"></div>
      </div>
    </div>

    <p class="cake-tip" id="cakeTip">👆 点击蜡烛（或画面空白处）把它们一根根吹灭</p>

    <div class="darkness" id="darkness"></div>
  </section>

  <!-- ===================== 第四幕 · 黑暗中的聊天 ===================== -->
  <section class="scene" id="scene-dark">
    <div class="phone" id="phone">
      <div class="phone-screen">
        <div class="chat-head">
          <span class="chat-avatar" id="chatAvatar">🎂</span>
          <div class="chat-who">
            <div class="chat-name" id="chatName">神秘人</div>
            <div class="chat-status" id="chatStatus">在线</div>
          </div>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input">
          <span class="chat-placeholder" id="chatPlaceholder">说点什么…</span>
          <span class="chat-send">↑</span>
        </div>
      </div>
    </div>

    <button class="btn btn-exit" id="exitBtn" type="button">退 出</button>

    <div class="ending" id="ending" hidden>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <h2 id="endTitle">生日快乐</h2>
      <p id="endText"></p>
      <button class="btn btn-ghost" id="restartBtn" type="button">重新开始</button>
    </div>
  </section>

  <script src="blessings.js"></script>
  <script src="password.js"></script>
  <script src="chat.js"></script>
  <script src="game.js"></script>
</body>
</html>
